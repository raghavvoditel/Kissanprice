<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <meta
            name="description"
            content="Compare live mandi prices, transport costs, and storage options across Maharashtra, Karnataka, Himachal Pradesh, and Tamil Nadu. Built for smallholder farmers who deserve real price transparency."
        />
        <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
        <link rel="canonical" href="https://kisanprice.example.com/" />

        <!--
        Open Graph / Twitter defaults. These are the tags link-preview bots
        (WhatsApp, iMessage, etc.) actually see, since they read this static
        HTML without running JS. Per-page title/description are additionally
        set at runtime via the useSEO hook for browsers and JS-aware crawlers.
        TODO: swap in the real production domain and a real 1200x630 og-image.png
        once available.
        -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="KisanPrice" />
        <meta property="og:title" content="KisanPrice — Compare Mandi Prices Before You Sell" />
        <meta
            property="og:description"
            content="Compare live mandi prices, transport costs, and storage options across Maharashtra, Karnataka, Himachal Pradesh, and Tamil Nadu. Built for smallholder farmers who deserve real price transparency."
        />
        <meta property="og:url" content="https://kisanprice.example.com/" />
        <meta property="og:image" content="https://kisanprice.example.com/og-image.png" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="KisanPrice — Compare Mandi Prices Before You Sell" />
        <meta
            name="twitter:description"
            content="Compare live mandi prices, transport costs, and storage options across Maharashtra, Karnataka, Himachal Pradesh, and Tamil Nadu. Built for smallholder farmers who deserve real price transparency."
        />
        <meta name="twitter:image" content="https://kisanprice.example.com/og-image.png" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
        <!--
        manifest.json provides metadata used when your web app is installed on a
        user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
        -->
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.
        Learn how to configure a non-root public URL by running `npm run build`.
        -->
        <title>KisanPrice — Compare Mandi Prices Before You Sell</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
